AWSTemplateFormatVersion: 2010-09-09

Description: Lab 5 - CloudWatch CPU alarms driving simple scaling of the aws3 Auto Scaling group, with SNS email notifications

###########################################################################
# Useful CloudFormation docs
###########################################################################
# functions:         https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference.html
# pseudo parameters: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/pseudo-parameter-reference.html
# pseudo attributes: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-product-attribute-reference.html
# template sections: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/template-anatomy.html
###########################################################################

Parameters:
  EC2StackName:
    Description: Name of parent EC2 CloudFormation stack
    Type: String
    Default: ec2

  NotificationEmail:
    Description: Email address subscribed to the CPU alarm SNS topic (must confirm the subscription)
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    ConstraintDescription: Must be a valid email address

Resources:
  PrivateASGHighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: PrivateASGHighCPUAlarm
      AlarmDescription: Scale up if average CPU is above 90% for 2 minutes in PrivateAutoScalingGroup
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      # EC2 publishes CPUUtilization every 60 s (detailed monitoring) or 300 s,
      # so a shorter period would only ever see missing data.
      Period: 60
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref PrivateASGScaleUpPolicy
        - !Ref CPUAlarmsSNSTopic
      Dimensions:
        - Name: AutoScalingGroupName
          Value:
            Fn::ImportValue: !Sub ${EC2StackName}-PrivateAutoScalingGroupId

  PrivateASGScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue: !Sub ${EC2StackName}-PrivateAutoScalingGroupId
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 2

  PrivateASGLowCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: PrivateASGLowCPUAlarm
      AlarmDescription: Scale down if average CPU is below 70% for 2 minutes in PrivateAutoScalingGroup
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 70
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref PrivateASGScaleDownPolicy
        - !Ref CPUAlarmsSNSTopic
      Dimensions:
        - Name: AutoScalingGroupName
          Value:
            Fn::ImportValue: !Sub ${EC2StackName}-PrivateAutoScalingGroupId

  PrivateASGScaleDownPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName:
        Fn::ImportValue: !Sub ${EC2StackName}-PrivateAutoScalingGroupId
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1

  CPUAlarmsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: CPUAlarmsSNSTopic
      Subscription:
        - Endpoint: !Ref NotificationEmail
          Protocol: email

  CPUAlarmsSNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CPUAlarmsSNSTopic
      PolicyDocument:
        Id: CPUAlarmsSNSTopicPolicy
        Version: 2012-10-17
        Statement:
          # CloudWatch only needs to publish alarm notifications; restrict it to
          # alarms owned by this account to avoid the confused-deputy problem.
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CPUAlarmsSNSTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId