AWSTemplateFormatVersion: 2010-09-09

Description: Lab 2 - Bastion host in a public subnet and a private instance reachable only through it


Parameters:
  Project:
    Description: Project
    Type: String
    Default: FRI

  Environment:
    Description: Environment
    Type: String
    Default: lab

  NetworkStackName:
    Description: Name of parent network CloudFormation stack
    Type: String
    Default: basic-network

  AdminCidr:
    Description: Source address allowed to SSH to the bastion, in CIDR form (e.g. 203.0.113.10/32)
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  SecondaryVpcCidr:
    Description: CIDR of the peered secondary VPC (see secondary-vpc.yaml)
    Type: String
    Default: 10.222.0.0/16

  ImageId:
    Description: AMI ID, resolved from the public SSM parameter for the latest Amazon Linux 2023 image in the current region
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  InstanceType:
    Description: Instance type (number of vCPUs, memory, bandwidth, etc.)
    Type: String
    Default: t3.micro

  IamInstanceProfileName:
    Description: Instance IAM profile name (account-specific, e.g. the SSM Quick Setup instance profile)
    Type: String

Resources:

  SSHKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: SSHKeyPair
      KeyType: rsa
      Tags:
        - Key: Name
          Value: SSHKeyPair
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref Project

  SecurityGroupForBastion:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SecurityGroup for bastion
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref AdminCidr, Description: SSH from admin address }
      SecurityGroupEgress:
        - { IpProtocol: tcp,  FromPort: 22, ToPort: 22, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: SSH to primary VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: Ping primary VPC }
        - { IpProtocol: tcp,  FromPort: 22, ToPort: 22, CidrIp: !Ref SecondaryVpcCidr, Description: SSH to peered VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: !Ref SecondaryVpcCidr, Description: Ping peered VPC }
      Tags:
        - { Key: Name, Value: Bastion_SG }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }

  BastionA:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      SubnetId:
        Fn::ImportValue: !Sub "${NetworkStackName}-PublicSubnetAId"
      SecurityGroupIds:
        - !Ref SecurityGroupForBastion
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref SSHKeyPair
      IamInstanceProfile: !Ref IamInstanceProfileName
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            echo "Hello world."
            echo "This instance was created in environment ${Environment} in region ${AWS::Region}"

          - Environment: !Ref Environment
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 30
            Encrypted: true
      Tags:
        - Key: Name
          Value: BastionA
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref Project

#####################################################################
#####################################################################          
  SSHKeyPairPrivate:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: SSHKeyPairPrivate
      KeyType: rsa
      Tags:
        - Key: Name
          Value: SSHKeyPairPrivate
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref Project

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private Security Group
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp,  FromPort: 22, ToPort: 22, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: SSH from bastion / VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: Ping from VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: !Ref SecondaryVpcCidr, Description: Ping from peered VPC }
      SecurityGroupEgress:
        - { IpProtocol: tcp,  FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS for package updates and SSM }
        - { IpProtocol: icmp, FromPort: -1,  ToPort: -1,  CidrIp: !Ref SecondaryVpcCidr, Description: Ping peered VPC }
      Tags:
        - { Key: Name, Value: PrivateSG }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }        


  PrivateInstanceA:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      SubnetId:
        Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnetAId"
      SecurityGroupIds:
        - !Ref PrivateSecurityGroup
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      KeyName: !Ref SSHKeyPairPrivate
      IamInstanceProfile: !Ref IamInstanceProfileName
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            echo "Hello world."
            echo "This instance was created in environment ${Environment} in region ${AWS::Region}"

          - Environment: !Ref Environment
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 30
            Encrypted: true
      Tags:
        - Key: Name
          Value: PrivateInstance
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref Project