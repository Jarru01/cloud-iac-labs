AWSTemplateFormatVersion: 2010-09-09

Description: >
  Lab 2 - Secondary VPC with one private instance, peered with the primary
  VPC from basic-network.yaml. Routes are created on both sides of the
  peering, so no peering ID has to be copied between stacks.

Parameters:
  VpcCidr:
    Description: CIDR of the secondary VPC (must not overlap the primary VPC)
    Type: String
    Default: 10.222.0.0/16

  Environment:
    Description: Environment
    Type: String
    Default: lab

  Project:
    Description: Project
    Type: String
    Default: FRI

  ImageId:
    Description: AMI ID, resolved from the public SSM parameter for the latest Amazon Linux 2023 image in the current region
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  InstanceType:
    Description: Instance type (number of vCPUs, memory, bandwidth, etc.)
    Type: String
    Default: t3.micro

  IamInstanceProfileName:
    Description: Instance IAM profile name (account-specific, e.g. the SSM Quick Setup instance profile)
    Type: String

  NetworkStackName:
    Description: Name of the primary network stack (deployed from basic-network.yaml)
    Type: String
    Default: basic-network

  PrivateSubnetIndex:
    Description: Index of the /24 block inside VpcCidr used for the private subnet
    Type: Number
    Default: 11

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - { Key: Name, Value: !Join [ '-', [!Ref Environment, vpc_secondary] ] }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }

  VpcPeering:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref Vpc
      PeerVpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VpcId
      Tags:
        - { Key: Name, Value: vpcpeering }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }

  ###################################################################
  # Secondary VPC: private subnet and route back to the primary VPC
  ###################################################################

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [ !Ref PrivateSubnetIndex, !Cidr [ !Ref VpcCidr, 256, 8 ]]
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      Tags:
        - { Key: Name, Value: PrivateSubnet_secondary }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: PrivateRouteTable_secondary }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  RouteToPrimaryVpc:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock:
        Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr'
      VpcPeeringConnectionId: !Ref VpcPeering

  ###################################################################
  # Primary VPC: routes to the secondary VPC (route tables exported by
  # basic-network.yaml). The public route lets the bastion reach the
  # secondary instance; the private route covers private subnet A.
  ###################################################################

  PrimaryPublicRouteToSecondary:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-PublicRouteTableId'
      DestinationCidrBlock: !Ref VpcCidr
      VpcPeeringConnectionId: !Ref VpcPeering

  PrimaryPrivateRouteToSecondary:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${NetworkStackName}-PrivateRouteTableAId'
      DestinationCidrBlock: !Ref VpcCidr
      VpcPeeringConnectionId: !Ref VpcPeering

  ###################################################################
  # Private instance in the secondary VPC
  ###################################################################

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secondary VPC private instance - SSH and ping from the primary VPC only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp,  FromPort: 22, ToPort: 22, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: SSH from primary VPC }
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: Ping from primary VPC }
      SecurityGroupEgress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: { Fn::ImportValue: !Sub '${NetworkStackName}-VpcCidr' }, Description: Ping primary VPC }
      Tags:
        - { Key: Name, Value: PrivateSG_secondary }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }

  PrivateInstanceA:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref PrivateSecurityGroup
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref IamInstanceProfileName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "Hello world."
          echo "This instance was created in environment ${Environment} in region ${AWS::Region}"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp2
            VolumeSize: 30
            Encrypted: true
      Tags:
        - Key: Name
          Value: PrivateInstance_secondaryVPC
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref Project

Outputs:
  VpcPeeringConnectionId:
    Value: !Ref VpcPeering

  PrivateInstanceIp:
    Value: !GetAtt PrivateInstanceA.PrivateIp
