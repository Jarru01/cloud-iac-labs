heat_template_version: 2018-08-31

description: >
  Task 8 - VM named after the stack ("<stack-name>-server") that returns
  its IPv4 address as a stack output.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  image:
    type: string
    description: Glance image for the VM
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VM
    default: 1c05r1d

resources:
  server:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: STACK-server
          params:
            STACK: { get_param: "OS::stack_name" }
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_param: external_net }

outputs:
  vm_ipv4_address:
    description: IPv4 address assigned to the server
    value: { get_attr: [server, networks, { get_param: external_net }, 0] }
