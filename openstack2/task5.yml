heat_template_version: 2018-08-31

description: >
  Task 5 - Two VMs attached directly to the external network (no internal
  subnet). Both allow ICMP and encrypted mail (SMTPS, submission, IMAPS,
  POP3S) and can talk to each other freely; SSH is open only on PC1 and
  RDP only on PC2.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  image:
    type: string
    description: Glance image for the VMs
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VMs
    default: 1c05r1d

resources:

  # -------------------------------------------------------
  # 1. Security groups
  # -------------------------------------------------------

  sec_group_common:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task5-common
      rules:
        - protocol: icmp

        # Encrypted mail: SMTPS (465), submission/STARTTLS (587),
        # IMAPS (993), POP3S (995)
        - { protocol: tcp, port_range_min: 465, port_range_max: 465 }
        - { protocol: tcp, port_range_min: 587, port_range_max: 587 }
        - { protocol: tcp, port_range_min: 993, port_range_max: 993 }
        - { protocol: tcp, port_range_min: 995, port_range_max: 995 }

        # Everything between members of this group (remote_group_id
        # defaults to the group itself when remote_mode is remote_group_id)
        - protocol: tcp
          remote_mode: remote_group_id
        - protocol: udp
          remote_mode: remote_group_id
        - protocol: icmp
          remote_mode: remote_group_id

  sec_group_pc1:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task5-pc1
      rules:
        # SSH on PC1 only
        - { protocol: tcp, port_range_min: 22, port_range_max: 22 }

  sec_group_pc2:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task5-pc2
      rules:
        # RDP on PC2 only
        - { protocol: tcp, port_range_min: 3389, port_range_max: 3389 }

  # -------------------------------------------------------
  # 2. Virtual machines
  # -------------------------------------------------------

  pc1:
    type: OS::Nova::Server
    properties:
      name: pc1
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_param: external_net }
      security_groups:
        - { get_resource: sec_group_common }
        - { get_resource: sec_group_pc1 }

  pc2:
    type: OS::Nova::Server
    properties:
      name: pc2
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_param: external_net }
      security_groups:
        - { get_resource: sec_group_common }
        - { get_resource: sec_group_pc2 }
