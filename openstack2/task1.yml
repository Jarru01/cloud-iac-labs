heat_template_version: 2018-08-31

description: >
  Task 1 - Neutron router with one internal network and two client VMs.
  PC1 allows ICMP + DNS, PC2 allows ICMP + HTTP/HTTPS.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  image:
    type: string
    description: Glance image for the VMs
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VMs
    default: 1c05r1d

resources:

  # -------------------------------------------------------
  # 1. Network: router, internal network and subnet
  # -------------------------------------------------------

  router:
    type: OS::Neutron::Router
    properties:
      name: router-task1
      external_gateway_info:
        network: { get_param: external_net }

  internal_net:
    type: OS::Neutron::Net
    properties:
      name: net-task1

  internal_subnet:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-task1
      network_id: { get_resource: internal_net }
      cidr: 192.168.88.0/24
      ip_version: 4
      gateway_ip: 192.168.88.1

  router_interface:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: internal_subnet }

  # -------------------------------------------------------
  # 2. Security groups
  # -------------------------------------------------------

  sec_group_pc1:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task1-pc1
      rules:
        - protocol: icmp
        # DNS over UDP and TCP
        - protocol: udp
          port_range_min: 53
          port_range_max: 53
        - protocol: tcp
          port_range_min: 53
          port_range_max: 53

  sec_group_pc2:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task1-pc2
      rules:
        - protocol: icmp
        # HTTP and HTTPS
        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
        - protocol: tcp
          port_range_min: 443
          port_range_max: 443

  # -------------------------------------------------------
  # 3. Virtual machines
  # -------------------------------------------------------

  pc1:
    type: OS::Nova::Server
    properties:
      name: pc1
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: internal_net }
      security_groups: [ { get_resource: sec_group_pc1 } ]

  pc2:
    type: OS::Nova::Server
    properties:
      name: pc2
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: internal_net }
      security_groups: [ { get_resource: sec_group_pc2 } ]
