heat_template_version: 2018-08-31

description: >
  Task 2 - One Neutron router connecting two internal networks.
  PC1 is in 192.168.33.0/24, PC2 in 192.168.35.0/24. ICMP and FTP are
  allowed on both, HTTP/HTTPS only on PC2, and the networks can talk to
  each other.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  image:
    type: string
    description: Glance image for the VMs
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VMs
    default: 1c05r1d

resources:

  # -------------------------------------------------------
  # 1. Network: router and two internal networks
  # -------------------------------------------------------

  router:
    type: OS::Neutron::Router
    properties:
      name: router-task2
      external_gateway_info:
        network: { get_param: external_net }

  net_pc1:
    type: OS::Neutron::Net
    properties:
      name: net-33

  subnet_pc1:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-33
      network_id: { get_resource: net_pc1 }
      cidr: 192.168.33.0/24
      gateway_ip: 192.168.33.1

  router_if_pc1:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: subnet_pc1 }

  net_pc2:
    type: OS::Neutron::Net
    properties:
      name: net-35

  subnet_pc2:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-35
      network_id: { get_resource: net_pc2 }
      cidr: 192.168.35.0/24
      gateway_ip: 192.168.35.1

  router_if_pc2:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: subnet_pc2 }

  # -------------------------------------------------------
  # 2. Security groups
  # -------------------------------------------------------

  sec_group_common:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task2-common
      rules:
        - protocol: icmp
        # FTP control channel on both PCs
        - protocol: tcp
          port_range_min: 21
          port_range_max: 21
        # Traffic between the two internal networks
        - protocol: tcp
          remote_ip_prefix: 192.168.33.0/24
        - protocol: tcp
          remote_ip_prefix: 192.168.35.0/24
        - protocol: icmp
          remote_ip_prefix: 192.168.33.0/24
        - protocol: icmp
          remote_ip_prefix: 192.168.35.0/24

  sec_group_pc2:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task2-pc2
      rules:
        # HTTP and HTTPS on PC2 only
        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
        - protocol: tcp
          port_range_min: 443
          port_range_max: 443

  # -------------------------------------------------------
  # 3. Virtual machines
  # -------------------------------------------------------

  pc1:
    type: OS::Nova::Server
    properties:
      name: pc1
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: net_pc1 }
      security_groups: [ { get_resource: sec_group_common } ]

  pc2:
    type: OS::Nova::Server
    properties:
      name: pc2
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: net_pc2 }
      security_groups:
        - { get_resource: sec_group_common }
        - { get_resource: sec_group_pc2 }
