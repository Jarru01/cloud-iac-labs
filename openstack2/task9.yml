heat_template_version: 2018-08-31

description: >
  Task 9 - VM with a security group that always allows SSH. A Telnet rule
  (TCP 23) is added only when the allow_telnet parameter is true, using a
  Heat condition.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  allow_telnet:
    type: boolean
    description: Open Telnet (TCP 23)?
    default: false
  image:
    type: string
    description: Glance image for the VM
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VM
    default: 1c05r1d

conditions:
  create_telnet_rule: { equals: [ { get_param: allow_telnet }, true ] }

resources:
  sec_group:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task9
      rules:
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22

  # Separate rule resource so it can be created conditionally
  telnet_rule:
    type: OS::Neutron::SecurityGroupRule
    condition: create_telnet_rule
    properties:
      security_group: { get_resource: sec_group }
      direction: ingress
      ethertype: IPv4
      protocol: tcp
      port_range_min: 23
      port_range_max: 23

  server:
    type: OS::Nova::Server
    properties:
      name: server-task9
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_param: external_net }
      security_groups:
        - { get_resource: sec_group }
