heat_template_version: 2018-08-31

description: >
  Task 3 - One Neutron router connecting two networks: 10.0.1.0/24 with PC1
  and 172.16.99.0/24 with PC2 and PC3. ICMP, SSH and RDP are allowed
  everywhere; HTTP/HTTPS and DNS only from the trusted network; all
  traffic between the two internal networks is allowed.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  trusted_cidr:
    type: string
    description: Network allowed to reach HTTP/HTTPS and DNS (the university network in the original assignment)
    default: 158.193.0.0/16
  image:
    type: string
    description: Glance image for the VMs
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VMs
    default: 1c05r1d

resources:

  # -------------------------------------------------------
  # 1. Network: router and two internal networks
  # -------------------------------------------------------

  router:
    type: OS::Neutron::Router
    properties:
      name: router-task3
      external_gateway_info:
        network: { get_param: external_net }

  net_a:
    type: OS::Neutron::Net
    properties:
      name: net-10-0-1

  subnet_a:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-10-0-1
      network_id: { get_resource: net_a }
      cidr: 10.0.1.0/24
      gateway_ip: 10.0.1.1

  router_if_a:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: subnet_a }

  net_b:
    type: OS::Neutron::Net
    properties:
      name: net-172-16-99

  subnet_b:
    type: OS::Neutron::Subnet
    properties:
      name: subnet-172-16-99
      network_id: { get_resource: net_b }
      cidr: 172.16.99.0/24
      gateway_ip: 172.16.99.1

  router_if_b:
    type: OS::Neutron::RouterInterface
    properties:
      router_id: { get_resource: router }
      subnet_id: { get_resource: subnet_b }

  # -------------------------------------------------------
  # 2. Security group
  # -------------------------------------------------------

  sec_group_main:
    type: OS::Neutron::SecurityGroup
    properties:
      name: sg-task3
      rules:
        - protocol: icmp

        # SSH and RDP from anywhere
        - protocol: tcp
          port_range_min: 22
          port_range_max: 22
        - protocol: tcp
          port_range_min: 3389
          port_range_max: 3389

        # HTTP/HTTPS and DNS only from the trusted network
        - protocol: tcp
          port_range_min: 80
          port_range_max: 80
          remote_ip_prefix: { get_param: trusted_cidr }
        - protocol: tcp
          port_range_min: 443
          port_range_max: 443
          remote_ip_prefix: { get_param: trusted_cidr }
        - protocol: udp
          port_range_min: 53
          port_range_max: 53
          remote_ip_prefix: { get_param: trusted_cidr }
        - protocol: tcp
          port_range_min: 53
          port_range_max: 53
          remote_ip_prefix: { get_param: trusted_cidr }

        # All protocols between the internal networks
        # (omitting 'protocol' makes Neutron match any protocol)
        - remote_ip_prefix: 10.0.1.0/24
        - remote_ip_prefix: 172.16.99.0/24

  # -------------------------------------------------------
  # 3. Virtual machines
  # -------------------------------------------------------

  pc1:
    type: OS::Nova::Server
    properties:
      name: pc1
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: net_a }
      security_groups: [ { get_resource: sec_group_main } ]

  pc2:
    type: OS::Nova::Server
    properties:
      name: pc2
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: net_b }
      security_groups: [ { get_resource: sec_group_main } ]

  pc3:
    type: OS::Nova::Server
    properties:
      name: pc3
      image: { get_param: image }
      flavor: { get_param: flavor }
      networks:
        - network: { get_resource: net_b }
      security_groups: [ { get_resource: sec_group_main } ]
