heat_template_version: 2018-08-31

description: >
  Task 7 - Generate a new SSH key pair inside the template and boot a VM
  with it. The private key is returned as a stack output. This needs a
  Nova API that still generates keys server-side (removed in compute API
  microversion 2.92), so it depends on the cloud's configuration.

parameters:
  external_net:
    type: string
    description: Name or ID of the external (provider) network
    default: ext-net-154
  image:
    type: string
    description: Glance image for the VM
    default: cirros
  flavor:
    type: string
    description: Nova flavor for the VM
    default: 1c05r1d

resources:
  # Nova generates the key pair; save_private_key keeps the private half
  # available to Heat so it can be shown in the outputs.
  generated_key:
    type: OS::Nova::KeyPair
    properties:
      name:
        str_replace:
          template: STACK-key
          params:
            STACK: { get_param: "OS::stack_name" }
      save_private_key: true

  vm:
    type: OS::Nova::Server
    properties:
      name:
        str_replace:
          template: STACK-vm
          params:
            STACK: { get_param: "OS::stack_name" }
      image: { get_param: image }
      flavor: { get_param: flavor }
      key_name: { get_resource: generated_key }
      networks:
        - network: { get_param: external_net }

outputs:
  private_key:
    description: Private SSH key for the VM - save it to a .pem file with mode 0600
    value: { get_attr: [generated_key, private_key] }
  vm_ip:
    description: Address of the VM
    value: { get_attr: [vm, networks, { get_param: external_net }, 0] }
